{% extends 'base.html' %}

{% block content %}
<div class="dashboard-page">
    <div class="tv-topbar">
        <div class="brand">Movie Club</div>
        <nav class="tv-nav">
            <a class="active">Home</a>
            <a>TV Shows</a>
            <a>Movies</a>
            <a>My List</a>
        </nav>
        <div class="tv-profile">
            <img src="/static/images/avatar.svg" alt="User avatar" />
        </div>
    </div>

    <section class="hero-card">
        <h2 class="dashboard-title">Welcome to Movie Club</h2>
        <p class="hero-lead">Browse curated lists, add favorites, and get movie suggestions tailored to you.</p>
        <div class="hero-actions page-actions">
            <a class="button" href="{{ url_for('login') }}">Sign in</a>
            <a class="button button--ghost" href="{{ url_for('register') }}">Create account</a>
        </div>
    </section>

    <p class="footer-note">Run the Flask app locally for the full interactive experience.</p>
</div>
{% endblock %}
