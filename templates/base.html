<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Club</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body {% block body_attrs %}{% endblock %}>
    <header class="header">
        <div class="header-inner container">
            <a class="logo" href="{{ url_for('index') }}">Movie Club</a>
            <nav class="site-nav">
                {% if current_user %}
                    <span class="nav-label">Signed in as {{ current_user }}</span>
                    <a class="button secondary" href="{{ url_for('logout') }}">Logout</a>
                {% else %}
                    <a class="button secondary" href="{{ url_for('login') }}">Login</a>
                    <a class="button secondary" href="{{ url_for('register') }}">Register</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="container">
        {% if error %}
            <div class="message warning">{{ error }}</div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
