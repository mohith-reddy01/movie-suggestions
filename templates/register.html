{% extends 'base.html' %}

{% block content %}
    <h1>Create a new account</h1>
    <p>Register once and use the app securely every time.</p>
    <form method="post" class="form-card">
        <div class="form-group">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" placeholder="Username" required />
        </div>
        <div class="form-group">
            <label for="display_name">Display name</label>
            <input id="display_name" name="display_name" type="text" placeholder="Your name" />
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Password" required />
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm password</label>
            <input id="confirm_password" name="confirm_password" type="password" placeholder="Confirm password" required />
        </div>
        <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a>.</p>
{% endblock %}
