<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=https://movie-suggestion2-production.up.railway.app/" />
  <link rel="canonical" href="https://movie-suggestion2-production.up.railway.app/" />
  <title>Movie Club - Redirecting to Live App</title>
  <script>
    window.location.replace("https://movie-suggestion2-production.up.railway.app/");
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --card: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.16);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #1e3a8a 0%, #07111f 50%, #030712 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      width: min(580px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 0.8rem;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 1.8rem;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .btn {
      display: inline-block;
      padding: 0.95rem 1.5rem;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 12px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(37, 99, 235, 0.45);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Live Flask App</span>
    <h1>Movie Club</h1>
    <div class="spinner"></div>
    <p>Redirecting you to the live dynamic web application on Railway...</p>
    <div class="btn-group">
      <a class="btn btn-primary" href="https://movie-suggestion2-production.up.railway.app/">Open Live Movie App</a>
      <a class="btn btn-secondary" href="https://github.com/mohith-reddy01/movie-suggestions">View GitHub Repository</a>
    </div>
  </main>
</body>
</html>
