<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Suggestion App</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --card: rgba(255,255,255,0.1);
      --text: #f8fafc;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #07111f 0%, #0f172a 50%, #2563eb 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .hero {
      width: min(1000px, 100%);
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 28px;
      padding: 2rem;
      backdrop-filter: blur(14px);
      box-shadow: 0 22px 60px rgba(0,0,0,0.25);
    }
    h1 { font-size: 2.2rem; margin-bottom: 0.8rem; }
    p { line-height: 1.7; color: #dbeafe; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .poster {
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
    }
    .poster img { display: block; width: 100%; height: auto; }
    .poster strong { display: block; padding: 0.8rem; }
    .btn {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.8rem 1.2rem;
      background: var(--accent);
      color: #07111f;
      font-weight: 700;
      border-radius: 999px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Movie Suggestion App</h1>
    <p>This is a static version of the website for GitHub Pages, styled to reflect the original movie recommendation experience.</p>
    <a class="btn" href="https://github.com/venkatamohithreddy-hue/movie-Suggestion2">View GitHub Repository</a>
    <div class="grid">
      <div class="poster"><img src="static/images/poster1.svg" alt="Inception poster" /><strong>Inception</strong></div>
      <div class="poster"><img src="static/images/poster2.svg" alt="The Matrix poster" /><strong>The Matrix</strong></div>
      <div class="poster"><img src="static/images/poster3.svg" alt="Interstellar poster" /><strong>Interstellar</strong></div>
    </div>
  </div>
</body>
</html>
